services:
  swarm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
    image: swarmbots/humble-fortress:latest
    container_name: swarm_dev
    hostname: swarm
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    pid: host
    privileged: false
    environment:
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: "/tmp/runtime-dev"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/home/dev/.Xauthority:rw
      - ../:/home/dev/swarm_ws:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, compute, utility]
    command: bash
